application:
  subdomain: owncast
  background_task: true
  public_path:
    - /
  entries:
    - id: main
      title: "Live Stream"
      path: /
    - id: admin
      title: "Administration"
      path: /admin
  upstreams:
    - location: /
      backend: http://owncast:8080/
  ingress:
    - protocol: tcp
      port: 1935
      service: owncast
      description: "RTMP ingest"
services:
  owncast:
    # upstream: docker.io/owncast/owncast:0.3.0
    image: docker.1ms.run/owncast/owncast:0.3.0
    binds:
      - /lzcapp/var/data:/app/data
usage: |
  打开应用进入 OwnCast 直播页面；管理后台位于 /admin。
  推流地址使用 rtmp://<懒猫设备地址>:1935/live，推流密钥请在管理后台查看和修改。
  本包未经实机验证；首次进入 /admin 请按向导设置管理员账号。
